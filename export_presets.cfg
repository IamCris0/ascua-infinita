[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/art/atlas.json,assets/art/imagegen/characters.json,locale/en.json"
exclude_filter="docs/*,tests/*,tools/*,builds/*,*.md"
export_path="builds/windows/AscuaInfinita.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release="res://.godot/export-templates/windows_release_x86_64.exe"
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=false
application/export_angle=0
application/export_d3d12=0

[preset.1]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="assets/art/atlas.json,assets/art/imagegen/characters.json,locale/en.json"
exclude_filter="docs/*,tests/*,tools/*,builds/*,*.md"
export_path="builds/web/index.html"
script_export_mode=2

[preset.1.options]
custom_template/debug=""
custom_template/release="res://.godot/export-templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
